<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Sensor Alerts</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Real-Time Sensor Monitoring</h1>

        <p>
            Click the button to process sensor data.
        </p>

        <button id="processSensors">
            Process Sensor Data
        </button>

        <div id="sensorResult"></div>

    </div>

<!-- QUESTION 2 -->

<section class="card">

    <h2>2. Intelligent Node Status</h2>

    <div id="dashboard">

        <div class="node online"
             data-node="Node-01"
             data-status="online">
            Node 01 - Online
        </div>

        <div class="node offline"
             data-node="Node-02"
             data-status="offline">
            Node 02 - Offline
        </div>

        <div class="node online"
             data-node="Node-03"
             data-status="online">
            Node 03 - Online
        </div>

        <div class="node offline"
             data-node="Node-04"
             data-status="offline">
            Node 04 - Offline
        </div>

    </div>

    <button id="scanNodes">
        Scan Offline Nodes
    </button>

    <p id="nodeResult"></p>

</section>
    <!-- QUESTION 3 -->

<section class="card">

    <h2>3. Event Flow in Interactive Chart</h2>

    <div id="chartArea">

        <div id="chartBox">

            <button id="dataPoint">
                Click Data Point
            </button>

        </div>

    </div>

    <p id="eventResult">
        Click the data point to observe event flow.
    </p>

</section>
<script src="script.js"></script>

</body>
</html>
